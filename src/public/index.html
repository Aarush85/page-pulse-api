<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Pulse API - Service Status</title>
  
  <!-- Metadata enhancements -->
  <meta name="description" content="A fast, resilient URL-audit API built for production.">
  <meta name="author" content="Page Pulse">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Page Pulse API">
  <meta property="og:description" content="URL-audit API built for the Digital Heroes Training Task.">
  <meta property="og:type" content="website">
  
  <style>
    :root {
      --bg: #121212;
      --text: #e0e0e0;
      --accent: #4caf50;
      --muted: #888;
      --card: #1e1e1e;
      --border: #333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      line-height: 1.6;
    }
    .container {
      background-color: var(--card);
      padding: 2rem 3rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { margin-top: 0; color: #fff; }
    p { margin-bottom: 2rem; color: var(--muted); }
    .status {
      display: inline-flex;
      align-items: center;
      background: rgba(76, 175, 80, 0.1);
      color: var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 99px;
      font-weight: 600;
      margin-bottom: 2rem;
      border: 1px solid rgba(76, 175, 80, 0.2);
    }
    .status::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 8px var(--accent);
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .links a {
      color: #fff;
      text-decoration: none;
      background-color: #2a2a2a;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      transition: background-color 0.2s, border-color 0.2s;
      border: 1px solid var(--border);
    }
    .links a:hover {
      background-color: #333;
      border-color: #555;
    }
    footer {
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      margin-top: 1rem;
    }
    footer a {
      color: #88c0d0;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Page Pulse API</h1>
    <div class="status">Service Online</div>
    <p>A fast, resilient URL-audit service featuring caching, concurrency control, and rate limiting.</p>
    
    <div class="links">
      <a href="/docs">📖 API Documentation (Swagger)</a>
      <a href="/health">⚙️ System Health Check</a>
      <a href="https://github.com/Aarush85/page-pulse-api" target="_blank" rel="noopener noreferrer">💻 GitHub Repository</a>
    </div>

    <footer>
      Built for <a href="https://digitalheroesco.com" target="_blank" rel="noopener noreferrer">Digital Heroes</a> Training Task
    </footer>
  </div>

</body>
</html>
